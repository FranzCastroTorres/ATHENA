<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Gestión de Préstamos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Solicitudes Pendientes</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container mt-4">
		<h4>Solicitudes pendientes de aprobación</h4>

		<table class="table table-striped table-hover">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Usuario</th>
					<th>Libro</th>
					<th>Fecha Solicitud</th>
					<th>Observación</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="s : ${lstPendientes}">
					<td th:text="${s.idSolicitud}"></td>
					<td th:text="${s.objUsuario != null ? s.objUsuario.nombre + ' ' + s.objUsuario.apellido : ''}"></td>
					<td th:text="${s.objLibro != null ? s.objLibro.titulo : ''}"></td>
					<td th:text="${s.fechaSolicitud}"></td>
					<td th:text="${s.observacion}"></td>
					<td>
						<a th:href="@{/prestamos/aprobar/{id}(id=${s.idSolicitud})}"
							class="btn btn-sm btn-success">Aprobar</a>
						<a th:href="@{/prestamos/rechazar/{id}(id=${s.idSolicitud})}"
							class="btn btn-sm btn-danger"
							onclick="return confirm('¿Rechazar esta solicitud?')">Rechazar</a>
					</td>
				</tr>
				<tr th:if="${lstPendientes == null or lstPendientes.isEmpty()}">
					<td colspan="6" class="text-center text-muted">No hay solicitudes pendientes</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
