<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Libros</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Mantenimiento de Libros</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container-fluid mt-4">
		<div class="row">

			<!-- FORMULARIO (izquierda) -->
			<div class="col-md-4">
				<h4>Datos del Libro</h4>
				<form action="/libros/grabar" method="post" th:object="${libro}">

					<input type="hidden" th:field="*{idLibro}">

					<div class="mb-3">
						<label class="form-label">Título</label>
						<input type="text" th:field="*{titulo}" required
							class="form-control" placeholder="Título del libro">
					</div>

					<div class="mb-3">
						<label class="form-label">Descripción</label>
						<textarea th:field="*{descripcion}" class="form-control"
							rows="2" placeholder="Descripción"></textarea>
					</div>

					<div class="row">
						<div class="col-6 mb-3">
							<label class="form-label">Año</label>
							<input type="number" th:field="*{anio}"
								class="form-control" placeholder="2024">
						</div>
						<div class="col-6 mb-3">
							<label class="form-label">ISBN</label>
							<input type="text" th:field="*{isbn}"
								class="form-control" placeholder="978-...">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Ubicación</label>
						<input type="text" th:field="*{ubicacion}"
							class="form-control" placeholder="Estante A1">
					</div>

					<!-- COMBO AUTOR -->
					<div class="mb-3">
						<label class="form-label">Autor</label>
						<select th:field="*{idAutor}" class="form-control" required>
							<option value="">Seleccione...</option>
							<option th:each="a : ${lstAutores}"
								th:value="${a.idAutor}"
								th:text="${a.nombre}"></option>
						</select>
					</div>

					<!-- COMBO EDITORIAL -->
					<div class="mb-3">
						<label class="form-label">Editorial</label>
						<select th:field="*{idEditorial}" class="form-control" required>
							<option value="">Seleccione...</option>
							<option th:each="e : ${lstEditoriales}"
								th:value="${e.idEditorial}"
								th:text="${e.nombre}"></option>
						</select>
					</div>

					<!-- COMBO CATEGORIA -->
					<div class="mb-3">
						<label class="form-label">Categoría</label>
						<select th:field="*{idCategoria}" class="form-control" required>
							<option value="">Seleccione...</option>
							<option th:each="c : ${lstCategorias}"
								th:value="${c.idCategoria}"
								th:text="${c.descripcion}"></option>
						</select>
					</div>

					<button type="submit" class="btn btn-primary">Guardar</button>
					<a href="/libros" class="btn btn-secondary">Nuevo</a>
				</form>

				<div class="mt-3" th:if="${mensaje != null}">
					<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
				</div>
			</div>

			<!-- TABLA (derecha) -->
			<div class="col-md-8">
				<h4>Libros Registrados</h4>
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Título</th>
							<th>Año</th>
							<th>Autor</th>
							<th>Editorial</th>
							<th>Categoría</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="l : ${lstLibros}">
							<td th:text="${l.idLibro}"></td>
							<td th:text="${l.titulo}"></td>
							<td th:text="${l.anio}"></td>
							<!-- nombres via objetos de relacion, no IDs -->
							<td th:text="${l.objAutor != null ? l.objAutor.nombre : ''}"></td>
							<td th:text="${l.objEditorial != null ? l.objEditorial.nombre : ''}"></td>
							<td th:text="${l.objCategoria != null ? l.objCategoria.descripcion : ''}"></td>
							<td>
								<a th:href="@{/libros/editar/{id}(id=${l.idLibro})}"
									class="btn btn-sm btn-warning">Editar</a>
								<a th:href="@{/libros/eliminar/{id}(id=${l.idLibro})}"
									class="btn btn-sm btn-danger"
									onclick="return confirm('¿Eliminar este libro?')">Eliminar</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
