<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Mis Solicitudes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Solicitar Préstamo</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container mt-4">
		<div class="row">

			<!-- FORMULARIO (izquierda) -->
			<div class="col-md-5">
				<h4>Nueva Solicitud</h4>
				<form action="/solicitudes/grabar" method="post">

					<!-- COMBO LIBRO -->
					<div class="mb-3">
						<label class="form-label">Libro que desea solicitar</label>
						<select name="idLibro" class="form-control" required>
							<option value="">Seleccione...</option>
							<option th:each="l : ${lstLibros}"
								th:value="${l.idLibro}"
								th:text="${l.titulo}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Observación (opcional)</label>
						<textarea name="observacion" class="form-control"
							rows="2" placeholder="Algún comentario"></textarea>
					</div>

					<button type="submit" class="btn btn-primary">Solicitar</button>
				</form>

				<div class="mt-3" th:if="${mensaje != null}">
					<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
				</div>
			</div>

			<!-- TABLA (derecha): solo MIS solicitudes -->
			<div class="col-md-7">
				<h4>Mis Solicitudes</h4>
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Libro</th>
							<th>Fecha</th>
							<th>Estado</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="s : ${lstSolicitudes}">
							<td th:text="${s.idSolicitud}"></td>
							<td th:text="${s.objLibro != null ? s.objLibro.titulo : ''}"></td>
							<td th:text="${s.fechaSolicitud}"></td>
							<td th:switch="${s.estado}">
								<span th:case="1" class="badge bg-warning text-dark">Pendiente</span>
								<span th:case="2" class="badge bg-success">Aprobada</span>
								<span th:case="3" class="badge bg-danger">Rechazada</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
