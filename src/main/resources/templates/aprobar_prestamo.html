<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Aprobar Solicitud</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Aprobar Solicitud de Préstamo</span>
		<a href="/prestamos" class="btn btn-sm btn-outline-light">Volver</a>
	</nav>

	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow">
					<div class="card-body">
						<h4 class="card-title">Confirmar Aprobación</h4>
						<hr>

						<!-- datos de la solicitud (solo lectura) -->
						<p><strong>Solicitud N°:</strong>
							<span th:text="${solicitud.idSolicitud}"></span></p>
						<p><strong>Usuario:</strong>
							<span th:text="${solicitud.objUsuario != null ? solicitud.objUsuario.nombre + ' ' + solicitud.objUsuario.apellido : ''}"></span></p>
						<p><strong>Libro:</strong>
							<span th:text="${solicitud.objLibro != null ? solicitud.objLibro.titulo : ''}"></span></p>
						<p><strong>Fecha solicitud:</strong>
							<span th:text="${solicitud.fechaSolicitud}"></span></p>

						<hr>

						<form action="/prestamos/aprobar" method="post">
							<!-- id de la solicitud (oculto) -->
							<input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitud}">

							<!-- COMBO EJEMPLARES DISPONIBLES -->
							<div class="mb-3">
								<label class="form-label">Ejemplar a asignar</label>
								<select name="idEjemplar" class="form-control" required>
									<option value="">Seleccione ejemplar...</option>
									<option th:each="ej : ${lstEjemplares}"
										th:value="${ej.idEjemplar}"
										th:text="${ej.codigo}"></option>
								</select>
								<small class="text-muted"
									th:if="${lstEjemplares == null or lstEjemplares.isEmpty()}">
									No hay ejemplares disponibles de este libro.
								</small>
							</div>

							<div class="mb-3">
								<label class="form-label">Observación (opcional)</label>
								<textarea name="observacion" class="form-control" rows="2"></textarea>
							</div>

							<div class="alert alert-info">
								El préstamo vencerá en <strong>7 días</strong> desde hoy.
							</div>

							<button type="submit" class="btn btn-success"
								th:disabled="${lstEjemplares == null or lstEjemplares.isEmpty()}">
								Confirmar Aprobación</button>
							<a href="/prestamos" class="btn btn-secondary">Cancelar</a>
						</form>

						<div class="mt-3" th:if="${mensaje != null}">
							<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
