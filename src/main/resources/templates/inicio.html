<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Inicio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">Sistema ATHENA - Biblioteca</span>
		<div class="text-white">
			<span th:text="${'Bienvenido: ' + usuario.nombre + ' ' + usuario.apellido}"></span>
			<a href="/logout" class="btn btn-sm btn-outline-light ms-3">Cerrar sesión</a>
		</div>
	</nav>

	<div class="container mt-4">
		<h2>Panel Principal</h2>
		<p>Rol activo:
			<span class="badge bg-primary" th:switch="${usuario.idRol}">
				<span th:case="1">Administrador</span>
				<span th:case="2">Bibliotecario</span>
				<span th:case="3">Usuario</span>
			</span>
		</p>
		<hr>

		<div class="row g-3">

			<!-- ADMINISTRADOR (rol 1) -->
			<th:block th:if="${usuario.idRol == 1}">
				<div class="col-md-3">
					<a href="/usuarios" class="btn btn-outline-dark w-100 py-3">Usuarios</a>
				</div>
				<div class="col-md-3">
					<a href="/autores" class="btn btn-outline-dark w-100 py-3">Autores</a>
				</div>
				<div class="col-md-3">
					<a href="/editoriales" class="btn btn-outline-dark w-100 py-3">Editoriales</a>
				</div>
				<div class="col-md-3">
					<a href="/categorias" class="btn btn-outline-dark w-100 py-3">Categorías</a>
				</div>
				<div class="col-md-3">
					<a href="/libros" class="btn btn-outline-dark w-100 py-3">Libros</a>
				</div>
				<div class="col-md-3">
					<a href="/ejemplares" class="btn btn-outline-dark w-100 py-3">Ejemplares</a>
				</div>
				<div class="col-md-3">
					<a href="/prestamos" class="btn btn-outline-dark w-100 py-3">Préstamos</a>
				</div>
				<div class="col-md-3">
					<a href="/reportes" class="btn btn-outline-warning w-100 py-3">Reportes</a>
				</div>
			</th:block>

			<!-- BIBLIOTECARIO (rol 2) -->
			<th:block th:if="${usuario.idRol == 2}">
				<div class="col-md-3">
					<a href="/libros" class="btn btn-outline-dark w-100 py-3">Libros</a>
				</div>
				<div class="col-md-3">
					<a href="/ejemplares" class="btn btn-outline-dark w-100 py-3">Ejemplares</a>
				</div>
				<div class="col-md-3">
					<a href="/prestamos" class="btn btn-outline-dark w-100 py-3">Préstamos</a>
				</div>
				<div class="col-md-3">
					<a href="/reportes" class="btn btn-outline-warning w-100 py-3">Reportes</a>
				</div>
			</th:block>

			<!-- USUARIO (rol 3) -->
			<th:block th:if="${usuario.idRol == 3}">
				<div class="col-md-3">
					<a href="/libros" class="btn btn-outline-dark w-100 py-3">Ver Catálogo</a>
				</div>
				<div class="col-md-3">
					<a href="/solicitudes" class="btn btn-outline-dark w-100 py-3">Solicitar Préstamo</a>
				</div>
				<div class="col-md-3">
					<a href="/reservas" class="btn btn-outline-dark w-100 py-3">Mis Reservas</a>
				</div>
			</th:block>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
