<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Autores</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Mantenimiento de Autores</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container mt-4">
		<div class="row">

			<!-- FORMULARIO (izquierda) -->
			<div class="col-md-5">
				<h4>Datos del Autor</h4>
				<form action="/autores/grabar" method="post" th:object="${autor}">

					<!-- id oculto: vacio = nuevo, con valor = editar -->
					<input type="hidden" th:field="*{idAutor}">

					<div class="mb-3">
						<label class="form-label">Nombre</label>
						<input type="text" th:field="*{nombre}" required
							class="form-control" placeholder="Nombre del autor">
					</div>

					<div class="mb-3">
						<label class="form-label">Nacionalidad</label>
						<input type="text" th:field="*{nacionalidad}"
							class="form-control" placeholder="Nacionalidad">
					</div>

					<div class="mb-3">
						<label class="form-label">Fecha de Nacimiento</label>
						<input type="date" th:field="*{fechaNacimiento}"
							class="form-control">
					</div>

					<div class="mb-3">
						<label class="form-label">Biografía</label>
						<textarea th:field="*{biografia}" class="form-control"
							rows="3" placeholder="Breve biografía"></textarea>
					</div>

					<button type="submit" class="btn btn-primary">Guardar</button>
					<a href="/autores" class="btn btn-secondary">Nuevo</a>
				</form>

				<div class="mt-3" th:if="${mensaje != null}">
					<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
				</div>
			</div>

			<!-- TABLA (derecha) -->
			<div class="col-md-7">
				<h4>Autores Registrados</h4>
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Nacionalidad</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="a : ${lstAutores}">
							<td th:text="${a.idAutor}"></td>
							<td th:text="${a.nombre}"></td>
							<td th:text="${a.nacionalidad}"></td>
							<td>
								<a th:href="@{/autores/editar/{id}(id=${a.idAutor})}"
									class="btn btn-sm btn-warning">Editar</a>
								<a th:href="@{/autores/eliminar/{id}(id=${a.idAutor})}"
									class="btn btn-sm btn-danger"
									onclick="return confirm('¿Eliminar este autor?')">Eliminar</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
