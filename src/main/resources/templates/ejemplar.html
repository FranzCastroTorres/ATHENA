<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Ejemplares</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Mantenimiento de Ejemplares</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container-fluid mt-4">
		<div class="row">

			<!-- FORMULARIO (izquierda) -->
			<div class="col-md-4">
				<h4>Datos del Ejemplar</h4>
				<form action="/ejemplares/grabar" method="post" th:object="${ejemplar}">

					<input type="hidden" th:field="*{idEjemplar}">

					<div class="mb-3">
						<label class="form-label">Código</label>
						<input type="text" th:field="*{codigo}" required
							class="form-control" placeholder="EJ-0001">
					</div>

					<!-- COMBO LIBRO -->
					<div class="mb-3">
						<label class="form-label">Libro</label>
						<select th:field="*{idLibro}" class="form-control" required>
							<option value="">Seleccione...</option>
							<option th:each="l : ${lstLibros}"
								th:value="${l.idLibro}"
								th:text="${l.titulo}"></option>
						</select>
					</div>

					<!-- COMBO ESTADO (situacion operativa) -->
					<div class="mb-3">
						<label class="form-label">Estado</label>
						<select th:field="*{estado}" class="form-control" required>
							<option value="1">Disponible</option>
							<option value="2">Prestado</option>
							<option value="3">Reservado</option>
							<option value="4">Dañado</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Observación</label>
						<textarea th:field="*{observacion}" class="form-control"
							rows="2" placeholder="Observación"></textarea>
					</div>

					<button type="submit" class="btn btn-primary">Guardar</button>
					<a href="/ejemplares" class="btn btn-secondary">Nuevo</a>
				</form>

				<div class="mt-3" th:if="${mensaje != null}">
					<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
				</div>
			</div>

			<!-- TABLA (derecha) -->
			<div class="col-md-8">
				<h4>Ejemplares Registrados</h4>
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Código</th>
							<th>Libro</th>
							<th>Estado</th>
							<th>Observación</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="e : ${lstEjemplares}">
							<td th:text="${e.idEjemplar}"></td>
							<td th:text="${e.codigo}"></td>
							<!-- titulo del libro via relacion -->
							<td th:text="${e.objLibro != null ? e.objLibro.titulo : ''}"></td>
							<!-- estado textual segun el numero -->
							<td th:switch="${e.estado}">
								<span th:case="1" class="badge bg-success">Disponible</span>
								<span th:case="2" class="badge bg-warning text-dark">Prestado</span>
								<span th:case="3" class="badge bg-info text-dark">Reservado</span>
								<span th:case="4" class="badge bg-danger">Dañado</span>
							</td>
							<td th:text="${e.observacion}"></td>
							<td>
								<a th:href="@{/ejemplares/editar/{id}(id=${e.idEjemplar})}"
									class="btn btn-sm btn-warning">Editar</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
