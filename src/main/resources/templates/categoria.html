<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Categorías</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<span class="navbar-brand">ATHENA - Mantenimiento de Categorías</span>
		<a href="/inicio" class="btn btn-sm btn-outline-light">Volver al inicio</a>
	</nav>

	<div class="container mt-4">
		<div class="row">

			<!-- FORMULARIO (izquierda) -->
			<div class="col-md-5">
				<h4>Datos de la Categoría</h4>
				<form action="/categorias/grabar" method="post" th:object="${categoria}">

					<input type="hidden" th:field="*{idCategoria}">

					<div class="mb-3">
						<label class="form-label">Descripción</label>
						<input type="text" th:field="*{descripcion}" required
							class="form-control" placeholder="Nombre de la categoría">
					</div>

					<button type="submit" class="btn btn-primary">Guardar</button>
					<a href="/categorias" class="btn btn-secondary">Nuevo</a>
				</form>

				<div class="mt-3" th:if="${mensaje != null}">
					<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
				</div>
			</div>

			<!-- TABLA (derecha) -->
			<div class="col-md-7">
				<h4>Categorías Registradas</h4>
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Descripción</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${lstCategorias}">
							<td th:text="${c.idCategoria}"></td>
							<td th:text="${c.descripcion}"></td>
							<td>
								<a th:href="@{/categorias/editar/{id}(id=${c.idCategoria})}"
									class="btn btn-sm btn-warning">Editar</a>
								<a th:href="@{/categorias/eliminar/{id}(id=${c.idCategoria})}"
									class="btn btn-sm btn-danger"
									onclick="return confirm('¿Eliminar esta categoría?')">Eliminar</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
