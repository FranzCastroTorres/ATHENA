<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ATHENA - Acceso al Sistema</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container">
		<div class="row justify-content-center mt-5">
			<div class="col-md-4">
				<div class="card shadow">
					<div class="card-body">
						<h3 class="card-title text-center mb-4">Sistema ATHENA</h3>
						<p class="text-center text-muted">Biblioteca</p>

						<form action="/login" method="post">
							<div class="mb-3">
								<label class="form-label">Correo</label>
								<input type="email" class="form-control" name="txtCorreo"
									placeholder="correo@athena.com" required>
							</div>
							<div class="mb-3">
								<label class="form-label">Clave</label>
								<input type="password" class="form-control" name="txtClave"
									required>
							</div>
							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Ingresar</button>
							</div>
						</form>

						<div class="mt-3" th:if="${mensaje != null}">
							<div th:class="${cssmensaje}" th:text="${mensaje}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
